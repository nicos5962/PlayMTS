# PlayMTS: the audio of MPEG transport stream files, using ffmpeg. Only the first audio stream is
# used (-map 0:a:0), as in the tag reader, mixed down to stereo; video,
# subtitles and data are dropped. The ffmpeg binary must be known to the server.

# Output formats from least to most favorite: flac is preferred over pcm.
proxy mts pcm,flc

mts pcm * *
	# FT:{START=-ss %s}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ -map 0:a:0 -vn -sn -dn -ac 2 -f s16le -acodec pcm_s16le -

mts flc * *
	# FT:{START=-ss %s}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ -map 0:a:0 -vn -sn -dn -ac 2 -sample_fmt s16 -f flac -compression_level 0 -

mts wav * *
	# FT:{START=-ss %s}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ -map 0:a:0 -vn -sn -dn -ac 2 -acodec pcm_s16le -f wav -

mts mp3 * *
	# FT:{START=-ss %s}B:{BITRATE=--abr %B}
	[ffmpeg] -loglevel quiet $START$ -i $FILE$ -map 0:a:0 -vn -sn -dn -ac 2 -acodec pcm_s16le -f wav - | [lame] --silent -q $QUALITY$ $BITRATE$ - -
